version: '3.9'
services:
  api:
    image: node:22-alpine
    working_dir: /app/backend
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/app
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
  web:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:3001
